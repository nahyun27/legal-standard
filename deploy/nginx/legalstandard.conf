# 리걸스탠다드 — /etc/nginx/sites-available/legalstandard.conf
# 대표 주소는 legalstandard.co.kr 하나. 나머지 도메인과 www 는 전부 여기로 301 이동한다(검색 노출을 한 주소로 모은다).
# 인증서 발급 순서는 deploy/README.md 참고 — certbot 이 아래 ssl_certificate 경로를 만든다.

# http → https (모든 도메인)
server {
    listen 80;
    listen [::]:80;
    server_name legalstandard.co.kr www.legalstandard.co.kr
                legalstandard.kr www.legalstandard.kr
                legalstandards.co.kr www.legalstandards.co.kr
                legalstandards.kr www.legalstandards.kr
                lawstandard.co.kr www.lawstandard.co.kr
                lawstandard.kr www.lawstandard.kr
                lawstandards.co.kr www.lawstandards.co.kr
                lawstandards.kr www.lawstandards.kr;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://legalstandard.co.kr$request_uri; }
}

# https 로 들어온 다른 도메인·www → 대표 주소
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.legalstandard.co.kr
                legalstandard.kr www.legalstandard.kr
                legalstandards.co.kr www.legalstandards.co.kr
                legalstandards.kr www.legalstandards.kr
                lawstandard.co.kr www.lawstandard.co.kr
                lawstandard.kr www.lawstandard.kr
                lawstandards.co.kr www.lawstandards.co.kr
                lawstandards.kr www.lawstandards.kr;

    ssl_certificate     /etc/letsencrypt/live/legalstandard-redirects/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/legalstandard-redirects/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://legalstandard.co.kr$request_uri;
}

# 대표 주소
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name legalstandard.co.kr;

    ssl_certificate     /etc/letsencrypt/live/legalstandard.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/legalstandard.co.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # 증거 파일 업로드 — 백엔드 MAX_UPLOAD_MB(20) 보다 약간 크게. 넘으면 백엔드가 아니라 Nginx 가 413 을 낸다
    client_max_body_size 25m;

    # Next 하나로 받는다. /api/v1 은 Next 가 백엔드(127.0.0.1:8002)로 넘긴다(src/app/api/v1/[...path]/route.ts).
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 접속자 IP 는 덧붙이지 않고 덮어쓴다 — 브라우저가 보낸 가짜 X-Forwarded-For 가 감사 로그에 남지 않게
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off; # 업로드를 Next 로 바로 흘려보낸다(라우트 핸들러가 스트리밍 전달)
        proxy_read_timeout 120s;
    }
}
